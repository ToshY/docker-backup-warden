name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Rotation smoke test against rustfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run S3 tests with RustFS
        run: task test

      - name: Dump rustfs logs on failure
        if: failure()
        run: docker compose logs rustfs

      - name: Tear down
        if: always()
        run: docker compose down -v
